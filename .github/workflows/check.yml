name: Website checks
on:
  pull_request:
  push:
    branches: ["dot/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run build
      - run: npm run check
      - name: Generated pages match source
        run: git diff --exit-code -- index.html 404.html munchminer/index.html circuit-stance/index.html about-us/index.html sitemap.xml robots.txt
